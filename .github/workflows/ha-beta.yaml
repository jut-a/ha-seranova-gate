name: Home Assistant beta

# Imports the integration into the newest Home Assistant on PyPI, beta included
# (script/check_ha_imports.py): fails on a module that no longer imports (a removed or
# renamed API) or a deprecation Home Assistant logs naming this integration. Betas come
# out on the last Wednesday of the month, a week before the release.
#
# Home Assistant only, no test kit: the kit is built for one stable release and its
# copied helpers break on the next one (2026.11.0 vs kit 2026.10.4: httpx alias,
# removed logger helper), and it has no beta builds. The full tests against a new
# release run on Dependabot's test-kit bump PR.
#
# Not run on pushes or PRs, so it never blocks a merge: a red scheduled run e-mails the
# repo owner.

on:
  schedule:
    - cron: "0 4 * * 4"
  workflow_dispatch:

jobs:
  imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install --pre homeassistant
      # Failures show as ::error:: annotations on the run page.
      - run: python script/check_ha_imports.py
